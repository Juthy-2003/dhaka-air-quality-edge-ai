name: CI
on: [pull_request, push]
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:   # tests create and drop their own database aq_test_<random> here
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: aq, POSTGRES_PASSWORD: aq, POSTGRES_DB: aq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aq" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://aq:aq@localhost:5432/aq
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - name: Replay data (needed by the replay test and model training)
        run: uv run python scripts/extract_dhaka.py
      - name: Train the edge model (tests load models/current)
        run: uv run python scripts/train_anomaly.py
      - run: uv run pytest -q

  model:
    # Retrain on the pinned data; the isolation forest must not regress on the
    # injected-fault test year (recorded: F1 0.816, precision 0.895).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run python scripts/extract_dhaka.py && uv run python scripts/train_anomaly.py
      - run: |
          python3 -c "
          import json; r = json.load(open('bench/results/anomaly.json'))['results']['iforest']
          print('iforest', r['precision'], r['recall'], r['f1'])
          assert r['f1'] >= 0.78 and r['precision'] >= 0.85, r"
      - uses: actions/upload-artifact@v4
        with: { name: edge-model, path: models/current/ }
